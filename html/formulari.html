<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M15 - Formulari Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
     <style>
        body {
            background-image: url('../img/tagdertoten.jfif');
            background-size: cover;
            background-position: center;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(8px);
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }
    </style>
</head>
<body>
    <script>
        async function cridaSubmit(event) {
          const nom = formulari.elements["nom"].value;
          alert("Hola " + nom);
        }  
    </script>
    <div class="row justify-content-center mt-5 text-light">
        <div class="col-md-7 col-lg-5">
    <form id="formulari" onsubmit="cridaSubmit(event)">
        <div class="row">
            <div class="col">
                <label class="form-label">Nom</label>
                <input type="text" name="nom" class="form-control" required>
            </div>
            <div class="col">
                <label class="form-label">Cognom</label>
                <input type="text" name="cognom" class="form-control" required>
            </div>
        </div>

         <div class="mb-3">
            <label class="form-label">Data de naixement</label>
            <input type="date" name="dataNaixement" class="form-control" required>
        </div>

         <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <legend class="col-form-label">Génere</legend>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios1" value="option1" checked>
            <label class="form-check-label" for="gridRadios1">
                Home
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios2" value="option2">
            <label class="form-check-label" for="gridRadios2">
                Dona
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="gridRadios" id="gridRadios3" value="option3">
            <label class="form-check-label" for="gridRadios3">
                Altres
            </label>
        </div>
        <div class="mb-3">
            <label for="inputState" class="form-label">Tipus d'informació</label>
            <select id="inputState" class="form-select">
                <option selected>Selecciona el tipus d'informació</option>
                <option>...</option>
                <option>...</option>
                <option>...</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label">Comentaris</label>
            <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
        </div>
    <button type="submit" class="btn btn-primary">
        Envia
    </button>
        </div>
    </div>
</body>
</html>
